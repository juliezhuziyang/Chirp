# Frontend service — Railway Root Directory must be "/" (repo root, NOT ml-service).
#
# Do NOT run "npm ci" here: Nixpacks already installs deps. A second npm ci races on
# node_modules/.vite and fails with EBUSY.
[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
